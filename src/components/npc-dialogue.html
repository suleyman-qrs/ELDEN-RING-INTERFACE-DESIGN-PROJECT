<!-- Enia, the Finger Reader -->
<dialog id="npc-dialog-enia" class="npc-dialog" aria-labelledby="npc-title-enia">
  <p id="npc-title-enia" class="npc-dialog__title">Enia, the Finger Reader</p>
  <form method="dialog" class="npc-dialog__topics">
    <button type="button" class="npc-topic-btn"
      data-audio="audio/dialogue/sigh.mp3"
      data-subtitle="..."
      data-npc-track="enia"
    >Speak with Enia</button>
    <button type="button" class="npc-topic-btn"
      data-audio="audio/dialogue/my oh my.mp3"
      data-subtitle="My, oh my..."
    >My, oh my…</button>
    <button type="button" class="npc-topic-btn npc-topic-btn--seek" id="npc-enia-topic-seek" hidden data-action="seek-elden-ring">Seek the Elden Ring</button>
    <button type="button" class="npc-topic-btn npc-topic-btn--leave">Leave</button>
  </form>
</dialog>

<!-- D, Hunter of the Dead -->
<dialog id="npc-dialog-d" class="npc-dialog" aria-labelledby="npc-title-d">
  <p id="npc-title-d" class="npc-dialog__title">D, Hunter of the Dead</p>
  <form method="dialog" class="npc-dialog__topics">
    <button type="button" class="npc-topic-btn"
      data-audio="audio/dialogue/roundtable/D/695395820.mp3,
                  audio/dialogue/roundtable/D/777200712.mp3,
                  audio/dialogue/roundtable/D/724558003.mp3,
                  audio/dialogue/roundtable/D/367712444.mp3,
                  audio/dialogue/roundtable/D/785567600.mp3,
                  audio/dialogue/roundtable/D/913138008.mp3"
      data-subtitle="I don't believe we've met. I'm known as D. I hunt down Those Who Live in Death, and weed their Deathroot. Heed my warning. Those Who Live in Death should be left well alone. All the more, should you spy a mariner among their number. Unless you wish to lay down your life in vain."
      data-unlocks="npc-d-topic-dead,npc-rogier-topic-d"
    >Speak with D</button>
    <button type="button" class="npc-topic-btn" id="npc-d-topic-dead" hidden
      data-audio="audio/dialogue/roundtable/D/791764503.mp3,
                  audio/dialogue/roundtable/D/819966277.mp3,
                  audio/dialogue/roundtable/D/846039931.mp3"
      data-subtitle="Those Who Live in Death fall outside the principles of the Golden Order. Their mere existence sullies the guidance of gold. Tainting its truth. And so it is the vermin must be exterminated... Down to the very last."
    >About Those Who Live in Death</button>
    <button type="button" class="npc-topic-btn npc-topic-btn--leave" value="leave">Leave</button>
  </form>
</dialog>

<!-- Gideon Ofnir, the All-Knowing -->
<dialog id="npc-dialog-gideon" class="npc-dialog" aria-labelledby="npc-title-gideon"
  data-idle-audio="audio/dialogue/roundtable/Gideon/627640454.mp3">
  <p id="npc-title-gideon" class="npc-dialog__title">Gideon Ofnir, the All-Knowing</p>
  <form method="dialog" class="npc-dialog__topics">
    <button type="button" class="npc-topic-btn"
      data-audio="audio/dialogue/roundtable/Gideon/349269325.mp3, 
                  audio/dialogue/roundtable/Gideon/468072585.mp3,"
      data-subtitle="Oh, this is a rare occasion. I can't remember the last time a new Tarnished made their way to the Roundtable."
      data-unlocks="npc-gideon-topic-advice"
    >Speak with Gideon Ofnir</button>
    <button type="button" class="npc-topic-btn" id="npc-gideon-topic-advice" hidden
      data-audio="audio/dialogue/roundtable/Gideon/252634078.mp3,
                  audio/dialogue/roundtable/Gideon/607776361.mp3,
                  audio/dialogue/roundtable/Gideon/358780146.mp3,
                  audio/dialogue/roundtable/Gideon/291363135.mp3"
      data-subtitle="Allow me a word of advice, as your senior. You are a mere visitor to the Roundtable, nothing more. A house guest, yet to earn their keep. Remember your place, newcomer."
      data-unlocks="npc-gideon-topic-houseguest"
    >A word of advice</button>
    <button type="button" class="npc-topic-btn" id="npc-gideon-topic-houseguest" hidden
      data-audio="audio/dialogue/roundtable/Gideon/1015100083.mp3,
                  audio/dialogue/roundtable/Gideon/1004634536.mp3,
                  audio/dialogue/roundtable/Gideon/582495506.mp3,
                  audio/dialogue/roundtable/Gideon/923527989.mp3,
                  audio/dialogue/roundtable/Gideon/547067172.mp3,
                  audio/dialogue/roundtable/Gideon/45105342.mp3,
                  audio/dialogue/roundtable/Gideon/862856441.mp3,
                  audio/dialogue/roundtable/Gideon/612480588.mp3,
                  audio/dialogue/roundtable/Gideon/335837193.mp3,
                  audio/dialogue/roundtable/Gideon/402367031.mp3,
                  audio/dialogue/roundtable/Gideon/60257426.mp3,
                  audio/dialogue/roundtable/Gideon/299942872.mp3"
      data-subtitle="Oh, are you aggrieved? At the notion you are but a visitant here? Then you would do well to remember the first words of grace given to you. Stand before the Elden Ring, and become the Elden Lord. If those words held any meaning to you... Follow the guidance of grace, lay low the shardbearers, and claim for yourself a Great Rune. Do so, and the doors to the Roundtable's inner chamber will open. And you will receive the wisdom of the Two Fingers. Once the wisdom of the Two Fingers becomes your own, I'll impart to you a proper welcome. As a true member of the Roundtable. I have high hopes for you. I'm sick and tired of them. These namby-pamby Tarnished think us no more than a shelter from the rain... We've spoken long enough. I have matters to attend to."
    >What do you mean, a house guest?</button>
    <button type="button" class="npc-topic-btn npc-topic-btn--leave" value="leave">Leave</button>
  </form>
</dialog>

<!-- Sorcerer Rogier -->
<dialog id="npc-dialog-rogier" class="npc-dialog" aria-labelledby="npc-title-rogier"
  data-idle-audio="audio/dialogue/roundtable/Rogier/136449782.mp3,">
  <p id="npc-title-rogier" class="npc-dialog__title">Sorcerer Rogier</p>
  <form method="dialog" class="npc-dialog__topics">
    <button type="button" class="npc-topic-btn"
      data-audio="audio/dialogue/roundtable/Rogier/522400236.mp3,
                  audio/dialogue/roundtable/Rogier/124588361.mp3"
      data-subtitle="Ah, nice to meet you. The pleasure's mine. Rogier's the name. A sorcerer, as you might have guessed."
      data-unlocks="npc-rogier-topic-tarnished"
    >Speak with Rogier</button>
    <button type="button" class="npc-topic-btn" id="npc-rogier-topic-tarnished" hidden
      data-audio="audio/dialogue/roundtable/Rogier/885867845.mp3,
                  audio/dialogue/roundtable/Rogier/747957509.mp3,
                  audio/dialogue/roundtable/Rogier/506414195.mp3"
      data-subtitle="I'm Tarnished, like you. But unlike you, I've seen neither hide nor hair of this guidance for the longest time. Still, I won't forget how it felt when I first came here, to the Lands Between."
    >About being Tarnished</button>
    <button type="button" class="npc-topic-btn" id="npc-rogier-topic-d" hidden
      data-audio="audio/dialogue/roundtable/Rogier/276092512.mp3,
                  audio/dialogue/roundtable/Rogier/819093019.mp3,
                  audio/dialogue/roundtable/Rogier/848974198.mp3,
                  audio/dialogue/roundtable/Rogier/450959944.mp3,
                  audio/dialogue/roundtable/Rogier/494444123.mp3"
      data-subtitle="Ah, so you've met D. D is an old friend. We found ourselves journeying together for a time, bound by our exploration of Death. But our paths have since diverged. Never again to cross. Though that's hardly an uncommon fate for two friends."
      data-unlocks="npc-rogier-topic-living-death"
    >About D</button>
    <button type="button" class="npc-topic-btn" id="npc-rogier-topic-living-death" hidden
      data-audio="audio/dialogue/roundtable/Rogier/747990722.mp3,
                  audio/dialogue/roundtable/Rogier/963106130.mp3,
                  audio/dialogue/roundtable/Rogier/526712448.mp3,
                  audio/dialogue/roundtable/Rogier/476812712.mp3,
                  audio/dialogue/roundtable/Rogier/1008946334.mp3,
                  audio/dialogue/roundtable/Rogier/493297941.mp3,
                  audio/dialogue/roundtable/Rogier/454013014.mp3"
      data-subtitle="I'm afraid there's something I must tell you. Do you know of Those Who Live in Death? The very notion of life in death defies the Golden Order. By D's account, these defiled fiends must be expunged. You may find this peculiar, but I discovered something in my examination of the Night of the Black Knives. These souls have committed no offence. They have every right to life, only, they happened to touch upon a flaw in the Order."
      data-unlocks="npc-rogier-topic-origin"
    >Those Who Live in Death</button>
    <button type="button" class="npc-topic-btn" id="npc-rogier-topic-origin" hidden
      data-audio="audio/dialogue/roundtable/Rogier/901392813.mp3,
                  audio/dialogue/roundtable/Rogier/207187486.mp3,
                  audio/dialogue/roundtable/Rogier/590309363.mp3,
                  audio/dialogue/roundtable/Rogier/639985473.mp3,
                  audio/dialogue/roundtable/Rogier/701338365.mp3,
                  audio/dialogue/roundtable/Rogier/820166801.mp3,
                  audio/dialogue/roundtable/Rogier/427976766.mp3,
                  audio/dialogue/roundtable/Rogier/88947943.mp3"
      data-subtitle="It happened during the Golden Age of the Erdtree, long before the shattering of the Elden Ring. Someone stole a fragment of the Rune of Death from Maliketh, the Black Blade. And on a bitter night, murdered Godwyn the Golden. That was the first recorded Death of a demigod in all history. And it became the catalyst. Soon, the Elden Ring was smashed, and thus sprang forth the war known as the Shattering. I once wished to become a scholar, you see. I've spent many an hour scouring the archives for knowledge of that fateful plot. The world has grown crooked, and if you intend to put it to rights, you'd better understand what happened to make it this way, mm?"
    >The Night of the Black Knives?</button>
    <button type="button" class="npc-topic-btn npc-topic-btn--leave" value="leave">Leave</button>
  </form>
</dialog>

<!-- Seek confirmation — shown when not all NPCs have been spoken to -->
<dialog id="dialog-seek-confirm" class="npc-dialog" aria-labelledby="seek-confirm-title">
  <div class="seek-confirm__body">
    <span class="seek-confirm__warning" aria-hidden="true">Grace Beckons</span>
    <p class="seek-confirm__question" id="seek-confirm-title">
      There are those you have yet to speak with.
    </p>
    <p class="seek-confirm__missed" id="seek-confirm-missed"></p>
    <div class="seek-confirm__actions">
      <button type="button" class="seek-confirm__btn seek-confirm__btn--yes" id="seek-confirm-yes">Depart</button>
      <button type="button" class="seek-confirm__btn seek-confirm__btn--no"  id="seek-confirm-no">Stay a while</button>
    </div>
  </div>
</dialog>
