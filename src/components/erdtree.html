<section id="erdtree-scroll" class="erdtree-hscroll" aria-label="The Erdtree"></section>
<div id="erdtree-stage" class="erdtree-stage" aria-hidden="true">
  <div class="erdtree-frame">
    <canvas id="erdtree-canvas"></canvas>

    <!-- Video overlays — replace PNG sequences for non-boss scenes -->
    <div class="scene-video" id="scene-elden-ring">
      <video src="video/scenes/elden_ring.mp4"      loop muted playsinline></video>
    </div>
    <div class="scene-video" id="scene-radagon">
      <video src="video/scenes/radagon.mp4"          loop muted playsinline></video>
    </div>
    <div class="scene-video" id="scene-hammer">
      <video src="video/scenes/hammer.mp4"           loop muted playsinline></video>
    </div>
    <div class="scene-video" id="scene-vyke">
      <video src="video/scenes/vyke.mp4"             loop muted playsinline></video>
    </div>
    <div class="scene-video" id="scene-malenia-radahn">
      <video src="video/scenes/malenia_radahn.mp4"   loop muted playsinline></video>
    </div>
    <div class="scene-video" id="scene-tarnished">
      <video src="video/scenes/tarnished.mp4"        loop muted playsinline></video>
    </div>
    <div class="scene-video" id="scene-erdtree">
      <video src="video/scenes/erdtree.mp4"          loop muted playsinline></video>
    </div>

    <!-- Boss image overlays — shown instead of the canvas for boss scenes -->
    <div class="boss-slide" id="boss-godrick">
      <img class="boss-slide__bg"   src="images/bosses/godrick_layer.png" alt="">
      <img class="boss-slide__char" src="images/bosses/godrick.png"       alt="">
    </div>
    <div class="boss-slide" id="boss-malenia">
      <img class="boss-slide__bg"   src="images/bosses/malenia_background.png" alt="">
      <img class="boss-slide__char" src="images/bosses/malenia.png"            alt="">
    </div>
    <div class="boss-slide" id="boss-radahn">
      <img class="boss-slide__bg"   src="images/bosses/radahn_background.png" alt="">
      <img class="boss-slide__char" src="images/bosses/radahn.png"            alt="">
    </div>
    <div class="boss-slide" id="boss-rykard">
      <img class="boss-slide__bg"   src="images/bosses/rykard_background.png" alt="">
      <img class="boss-slide__char" src="images/bosses/rykard.png"            alt="">
    </div>
    <div class="boss-slide" id="boss-margit">
      <img class="boss-slide__bg"    src="images/bosses/margit_background.png" alt="">
      <img class="boss-slide__char"  src="images/bosses/margit.png"            alt="">
      <img class="boss-slide__front" src="images/bosses/margit_front.png"      alt="">
    </div>
  </div>

  <div class="erdtree-vignette"></div>
  <p id="erdtree-subtitle" class="erdtree-subtitle"></p>
</div>
