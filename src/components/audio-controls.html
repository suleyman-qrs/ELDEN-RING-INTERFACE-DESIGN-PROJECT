<div id="audio-controls" class="audio-controls" aria-label="Audio settings">
  <p class="audio-controls__title">Sound</p>

  <label class="audio-ctrl-row">
    <input type="checkbox" id="toggle-bgm" class="audio-ctrl-input" checked>
    <span class="audio-ctrl-mark" aria-hidden="true"></span>
    <span class="audio-ctrl-label">Music</span>
  </label>

  <label class="audio-ctrl-row">
    <input type="checkbox" id="toggle-dialogue" class="audio-ctrl-input" checked>
    <span class="audio-ctrl-mark" aria-hidden="true"></span>
    <span class="audio-ctrl-label">Dialogue</span>
  </label>

  <label class="audio-ctrl-row">
    <input type="checkbox" id="toggle-sfx" class="audio-ctrl-input" checked>
    <span class="audio-ctrl-mark" aria-hidden="true"></span>
    <span class="audio-ctrl-label">SFX</span>
  </label>
</div>
