<dialog id="choice-overlay" class="choice-overlay" aria-labelledby="choice-prompt">
  <p id="choice-prompt" class="choice-prompt">Approach her&nbsp;&nbsp;?</p>
  <form method="dialog" class="choice-form">
    <button class="choice-btn choice-btn--yes" value="yes">I'm interested</button>
    <button class="choice-btn choice-btn--no"  value="no">I'd rather not</button>
  </form>
</dialog>
