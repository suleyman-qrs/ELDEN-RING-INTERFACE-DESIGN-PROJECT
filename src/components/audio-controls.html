<div id="audio-controls" class="audio-controls" aria-label="Audio settings">
  <p class="audio-controls__title">Sound</p>

  <label class="audio-controls__row">
    <input type="checkbox" id="toggle-bgm" class="audio-controls__input" checked>
    <span class="audio-controls__mark" aria-hidden="true"></span>
    <span class="audio-controls__label">Music</span>
  </label>

  <label class="audio-controls__row">
    <input type="checkbox" id="toggle-dialogue" class="audio-controls__input" checked>
    <span class="audio-controls__mark" aria-hidden="true"></span>
    <span class="audio-controls__label">Dialogue</span>
  </label>

  <label class="audio-controls__row">
    <input type="checkbox" id="toggle-sfx" class="audio-controls__input" checked>
    <span class="audio-controls__mark" aria-hidden="true"></span>
    <span class="audio-controls__label">SFX</span>
  </label>
</div>
