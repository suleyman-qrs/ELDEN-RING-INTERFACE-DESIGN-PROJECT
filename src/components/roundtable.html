<section
  id="roundtable"
  class="phase phase--roundtable"
  aria-label="Roundtable Hold"
>
  <div class="rt-layers" aria-hidden="true">
    <img
      id="rt-base"
      class="rt-layer rt-layer--base"
      src="images/0_elden_ring_roundtable_hold_background.png"
      alt=""
    />
    <img
      src="images/1_elden_ring_roundtable_hold_crone.png"
      alt=""
      aria-hidden="true"
      class="rt-layer rt-layer--hover"
      usemap="#map_crone"
    />
    <map name="map_crone">
      <area shape="rect" coords="500, 100,1000, 1000" id="rt-hover" alt="" />
    </map>
  </div>
  <div class="rt-vignette" aria-hidden="true"></div>
  <div class="rt-hint">
    <span>Approach</span>
  </div>
</section>
