<!-- D, Hunter of the Dead -->
<dialog id="npc-dialog-d" class="npc-dialog" aria-labelledby="npc-title-d">
  <p id="npc-title-d" class="npc-dialog__title">D, Hunter of the Dead</p>
  <form method="dialog" class="npc-dialog__topics">
    <button class="npc-topic-btn"
      data-audio="audio/dialogue/roundtable/D/695395820.wav,
                  audio/dialogue/roundtable/D/777200712.wav,
                  audio/dialogue/roundtable/D/724558003.wav,
                  audio/dialogue/roundtable/D/367712444.wav,
                  audio/dialogue/roundtable/D/785567600.wav,
                  audio/dialogue/roundtable/D/913138008.wav"
      data-subtitle="I don't believe we've met. I'm known as D. I hunt down Those Who Live in Death, and weed their Deathroot. Heed my warning. Those Who Live in Death should be left well alone. All the more, should you spy a mariner among their number. Unless you wish to lay down your life in vain."
    >About D</button>
    <button class="npc-topic-btn"
      data-audio="audio/dialogue/roundtable/D/260113537.wav,
                  audio/dialogue/roundtable/D/234442.wav"
      data-subtitle="I serve the Golden Order. That I might put this crooked land to rights."
    >I serve the Golden Order.</button>
    <button class="npc-topic-btn"
      data-audio="audio/dialogue/roundtable/D/675347552.wav,
                  audio/dialogue/roundtable/D/791764503.wav,
                  audio/dialogue/roundtable/D/819966277.wav,
                  audio/dialogue/roundtable/D/846039931.wav"
      data-subtitle="Following only the guidance of the great Elden Ring. Those Who Live in Death fall outside the principles of the Golden Order. Their mere existence sullies the guidance of gold. Tainting its truth. And so it is the vermin must be exterminated... Down to the very last."
    >About hunting Those Who Live in Death</button>
    <button class="npc-topic-btn npc-topic-btn--leave" value="leave">Leave</button>
  </form>
</dialog>

<!-- Gideon Ofnir, the All-Knowing -->
<dialog id="npc-dialog-gideon" class="npc-dialog" aria-labelledby="npc-title-gideon">
  <p id="npc-title-gideon" class="npc-dialog__title">Gideon Ofnir, the All-Knowing</p>
  <form method="dialog" class="npc-dialog__topics">
    <button class="npc-topic-btn"
      data-audio="audio/dialogue/roundtable/Gideon/349269325.wav"
      data-subtitle="Oh, this is a rare occasion. I can't remember the last time a new Tarnished made their way to the Roundtable."
    >About Gideon</button>
    <button class="npc-topic-btn"
      data-audio="audio/dialogue/roundtable/Gideon/252634078.wav,
                  audio/dialogue/roundtable/Gideon/607776361.wav,
                  audio/dialogue/roundtable/Gideon/358780146.wav,
                  audio/dialogue/roundtable/Gideon/291363135.wav"
      data-subtitle="Allow me a word of advice, as your senior. You are a mere visitor to the Roundtable, nothing more. A house guest, yet to earn their keep. Remember your place, newcomer."
    >About the Roundtable</button>
    <button class="npc-topic-btn npc-topic-btn--leave" value="leave">Leave</button>
  </form>
</dialog>

<!-- Sorcerer Rogier -->
<dialog id="npc-dialog-rogier" class="npc-dialog" aria-labelledby="npc-title-rogier">
  <p id="npc-title-rogier" class="npc-dialog__title">Sorcerer Rogier</p>
  <form method="dialog" class="npc-dialog__topics">
    <button class="npc-topic-btn"
      data-audio="audio/dialogue/roundtable/Rogier/522400236.wav,
                  audio/dialogue/roundtable/Rogier/124588361.wav"
      data-subtitle="Ah, nice to meet you. The pleasure's mine. Rogier's the name. A sorcerer, as you might have guessed."
    >About Rogier</button>
    <button class="npc-topic-btn"
      data-audio="audio/dialogue/roundtable/Rogier/885867845.wav,
                  audio/dialogue/roundtable/Rogier/747957509.wav,
                  audio/dialogue/roundtable/Rogier/506414195.wav"
      data-subtitle="I'm Tarnished, like you. But unlike you, I've seen neither hide nor hair of this guidance for the longest time. Still, I won't forget how it felt when I first came here, to the Lands Between."
    >About being Tarnished</button>
    <button class="npc-topic-btn npc-topic-btn--leave" value="leave">Leave</button>
  </form>
</dialog>
